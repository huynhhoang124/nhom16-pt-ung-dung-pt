# GS-01: mỗi push/PR vào dev, main chạy test unit + build frontend. PR đỏ không được merge.
name: ci
on:
  push: { branches: [dev, main] }
  pull_request: { branches: [dev, main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      # aggregator-service/test dùng lại code parking-node nên cài parking-node trước
      - run: npm ci && node --test --test-concurrency=2 test/*.test.js
        working-directory: parking-node
      - run: npm ci && node --test --test-concurrency=2 test/*.test.js
        working-directory: aggregator-service
      - run: npm ci && npm test
        working-directory: notification-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  # GS-02: dựng cả hệ thống bằng docker compose rồi chạy test e2e trên Postgres/RabbitMQ thật (khoảng 5 phút).
  # Chỉ chạy cho PR vào main hoặc PR có nhãn "e2e" để không làm chậm mọi PR.
  e2e:
    if: github.event_name == 'push' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: cp .env.example .env
      - run: node scripts/gen-keys.mjs   # PT-05: khoá RS256 để chạy TC46 (nhân viên gọi thẳng node khi Aggregator sập)
      - run: npm ci
        working-directory: frontend   # e2e dùng socket.io-client của frontend
      - run: npm ci
        working-directory: aggregator-service   # PD-02 e2e broker publisher / amqplib
      - run: docker compose up -d --build --wait
        env: { COMMAND_MODE: http }
      - run: node --test tests/e2e.test.mjs
        env: { COMMAND_MODE: http }
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down

  retry-dlq:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pd08-ci
      COMPOSE_FILE: docker-compose.yml:tests/pd08-compose.test.yml
      PD08_AMQP_URL: amqp://parking:parking@localhost:5683/%2F
      PD08_DATABASE_URL: postgres://postgres:dev@localhost:25442/parking
      PD08_AGG_DATABASE_URL: postgres://postgres:dev@localhost:25443/parking
      PD02_AMQP_URL: amqp://parking:parking@localhost:5683/%2F
      COMMAND_MODE: http
      AGGREGATOR_URL: http://localhost:18010
      PARKING_BASE_PORT: '18101'
      FRONTEND_URL: http://localhost:13010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: cp .env.example .env
      - run: node scripts/gen-keys.mjs
      - run: npm ci --prefix parking-node && npm ci --prefix aggregator-service && npm ci --prefix frontend
      - run: docker compose build parking-a aggregator frontend notification pd08-unit
      - run: docker compose run --rm --no-deps pd08-unit
      - run: docker compose up -d --no-build --wait rabbitmq parking-a parking-b parking-c aggregator frontend notification
      - run: node --test tests/pd08-runtime.test.cjs
        env: { PD08_RUNTIME: '1' }
      - run: docker compose stop parking-a parking-b parking-c aggregator
      - run: node --test tests/pd08-retry.integration.cjs
      - if: always()
        run: docker compose start parking-a parking-b parking-c aggregator
      - run: node --test tests/e2e.test.mjs
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
