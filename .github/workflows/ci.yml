# GS-01: mỗi push/PR vào dev, main chạy test unit + build frontend. PR đỏ không được merge.
name: ci
on:
  push: { branches: [dev, main] }
  pull_request: { branches: [dev, main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      # Hai package dùng chéo mã nguồn của nhau, nên cài dependencies cả hai trước khi chạy test.
      - run: npm ci
        working-directory: parking-node
      - run: npm ci
        working-directory: aggregator-service
      - run: npm ci
        working-directory: notification-service
      - run: npm test
        working-directory: parking-node
      - run: npm test
        working-directory: aggregator-service
      - run: npm test
        working-directory: notification-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  # GS-02: dựng cả hệ thống bằng Docker Compose rồi chạy test e2e trên Postgres/RabbitMQ thật.
  # PD-24 cũng chạy TC77 với Jaeger trên nhánh tracing để xác nhận trace xuyên dịch vụ.
  e2e:
    if: github.event_name == 'push' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'e2e') || contains(github.head_ref, 'PD-24')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "**/package-lock.json" }
      - run: cp .env.example .env
      - run: node scripts/gen-keys.mjs   # PT-05: khoá RS256 để chạy TC46 (nhân viên gọi thẳng node khi Aggregator sập)
      - run: npm ci
        working-directory: frontend   # e2e dùng socket.io-client của frontend
      - run: npm ci
        working-directory: aggregator-service   # PD-02 e2e broker publisher / amqplib
      - run: docker compose up -d --build --wait
        env: { COMMAND_MODE: http }
      - run: node --test tests/e2e.test.mjs
        env: { COMMAND_MODE: http }
      - run: docker compose down
      - run: docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile obs up -d --build --wait
        env: { COMMAND_MODE: broker }
      - run: node tests/pd24-tracing.e2e.mjs
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile obs logs --no-color --tail 200
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.tracing.yml --profile obs down
