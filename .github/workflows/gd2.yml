name: GĐ2 integration
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'aggregator-service/**'
      - 'parking-node/**'
      - 'failover-manager/**'
      - 'stats-service/**'
      - 'rabbitmq/**'
      - 'scripts/prepare-rabbit-ha.sh'
      - '.github/workflows/gd2.yml'
concurrency:
  group: gd2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [stats, replica, sac, scale, shards]
    env:
      COMPOSE_PROJECT_NAME: gd2-ci
      COMMAND_MODE: http
      RABBITMQ_URL: amqp://parking:parking@rabbitmq/%2F
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env && node scripts/gen-keys.mjs
      - run: npm ci --prefix aggregator-service && npm ci --prefix frontend
      - if: matrix.profile == 'stats'
        env:
          COMPOSE_PROFILES: stats
          USE_STATS_SERVICE: 'true'
          STATS_E2E: '1'
        run: |
          docker compose up -d --build --wait
          node --test --test-name-pattern='PD-23' tests/e2e.test.mjs
      - if: matrix.profile == 'replica'
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.scale.yml
          COMPOSE_PROFILES: scale,coord,ha
        run: |
          docker compose up -d --build
          for port in 8000 8001 8005; do
            curl --fail --retry 40 --retry-all-errors --retry-delay 2 "http://localhost:$port/health"
          done
          node --test tests/tc71.pd15.test.mjs
          TC71_PARKING_ID=E node --test tests/tc71.pd15.test.mjs
      - if: matrix.profile == 'sac'
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.pd13.yml
          COMPOSE_PROFILES: ha,pd13
          COMMAND_MODE: broker
          RABBITMQ_URL: amqp://parking:parking@rabbitmq/%2F,amqp://parking:parking@rabbitmq-2/%2F,amqp://parking:parking@rabbitmq-3/%2F
          PD13: '1'
        run: |
          docker compose up -d --build
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          node --test --test-name-pattern='PD-05|TC60' tests/e2e.test.mjs
      - if: matrix.profile == 'scale'
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.scale.yml
          COMPOSE_PROFILES: scale,coord,ha
          RABBITMQ_URL: amqp://parking:parking@rabbitmq/%2F,amqp://parking:parking@rabbitmq-2/%2F,amqp://parking:parking@rabbitmq-3/%2F
          SCALE: '1'
          COORD: '1'
          HA: '1'
          ENABLE_TEST_FAULTS: '1'
        run: |
          docker compose up -d --build
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          docker compose exec -T rabbitmq sh -s < scripts/prepare-rabbit-ha.sh
          node --test tests/e2e.test.mjs
      - if: matrix.profile == 'shards'
        env:
          COMPOSE_FILE: docker-compose.yml:docker-compose.shard.yml
          SHARD: '1'
          HA: '1'
        run: |
          docker compose up -d --build --wait
          node --test --test-name-pattern='TC73|TC-PD21' tests/e2e.test.mjs
      - if: failure()
        run: docker compose logs --no-color --tail 60
  jepsen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: TC78, ids: 'A,B,C,D,E,F', args: '--scenario tc78 --nemesis partition --seed 42 --time 120' }
          - { name: TC79, ids: 'A,B,C', args: '--scenario tc79 --seed 42 --time 60' }
          - { name: failover-42, ids: 'A,B,C,D,E,F', args: '--nemesis random --seed 42 --time 300' }
          - { name: failover-43, ids: 'A,B,C,D,E,F', args: '--nemesis random --seed 43 --time 300' }
    env:
      JEPSEN_PARKING_IDS: ${{ matrix.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/jepsen/*.test.mjs
      - run: node tests/jepsen/run.mjs ${{ matrix.args }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jepsen-${{ matrix.name }}
          path: tests/jepsen/results/
  tc80:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [http, broker]
    env:
      COMPOSE_PROJECT_NAME: gd2-tc80
      COMPOSE_FILE: docker-compose.yml:docker-compose.chaos.yml:tests/load/benchmark-slots.compose.yml
      COMPOSE_PROFILES: chaos
      COMMAND_MODE: ${{ matrix.mode }}
      K6_NETWORK: gd2-tc80_default
      LOOKUP_P95_MS: '250'
      RESERVE_P95_MS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env && node scripts/gen-keys.mjs
      - run: |
          docker compose up -d --build --wait
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          node scripts/net.mjs B latency 1500
      - name: Measure 300 VU with a slow parking node
        id: measure
        continue-on-error: true
        run: bash scripts/do-so-sanh.sh tc80-ci-${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc80-${{ matrix.mode }}
          path: tai-lieu/ket-qua-do/tc80-ci-${{ matrix.mode }}.*
      - if: steps.measure.outcome == 'failure'
        run: echo "::warning::TC80 workload exited nonzero. Review the k6 result and SLO before marking PD-27 complete."
