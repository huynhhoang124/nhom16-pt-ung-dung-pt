name: Performance acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/performance.yml'
      - 'aggregator-service/**'
      - 'parking-node/**'
      - 'tests/load/**'
      - 'frontend/nginx.conf'
defaults:
  run:
    shell: bash
jobs:
  tc80:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: perf-acceptance
      COMPOSE_FILE: docker-compose.yml:docker-compose.chaos.yml
      COMPOSE_PROFILES: chaos
      COMMAND_MODE: broker
      K6_NETWORK: perf-acceptance_default
      LOOKUP_P95_MS: '250'
      RESERVE_P95_MS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env && node scripts/gen-keys.mjs
      - run: |
          docker compose up -d --build --wait
          curl --fail --retry 40 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          sleep 10
          node scripts/net.mjs B latency 1500
          for db in db-a db-b db-c db-agg; do
            docker compose exec -T "$db" psql -U postgres -d parking -c 'ALTER SYSTEM SET track_wal_io_timing=on' -c 'SELECT pg_reload_conf()'
          done
      - run: |
          mkdir -p tai-lieu/ket-qua-do
          lscpu > tai-lieu/ket-qua-do/tc80-acceptance-host.log
          docker stats --format '{{json .}}' > tai-lieu/ket-qua-do/tc80-acceptance-cpu.log &
          stats_pid=$!
          trap 'kill "$stats_pid" 2>/dev/null || true' EXIT
          bash scripts/do-so-sanh.sh tc80-acceptance
      - if: always()
        run: node tests/load/command-stages.mjs | tee tai-lieu/ket-qua-do/tc80-acceptance-stages.log
      - run: node tests/load/check-invariants.mjs | tee tai-lieu/ket-qua-do/tc80-acceptance-invariants.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc80-acceptance
          path: tai-lieu/ket-qua-do/tc80-acceptance*
      - if: failure()
        run: docker compose logs --no-color --tail 70
  pd20:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pd20-perf
      COMPOSE_FILE: docker-compose.yml:docker-compose.chaos.yml:tests/pd20.compose.yml
      COMPOSE_PROFILES: chaos
      COMMAND_MODE: http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cp .env.example .env && node scripts/gen-keys.mjs
      - run: |
          docker compose up -d --build --wait
          node scripts/net.mjs B latency 1500
          sleep 10
      - name: Compare hedging disabled and enabled
        run: |
          mkdir -p tai-lieu/ket-qua-do/pd20
          for mode in false true; do
            HEDGE_ENABLED=$mode docker compose up -d --no-deps aggregator
            sleep 10
            docker run --rm --user "$(id -u):$(id -g)" --network pd20-perf_default               --mount "type=bind,source=$PWD/tests/load,target=/work,readonly"               --mount "type=bind,source=$PWD/tai-lieu/ket-qua-do/pd20,target=/results"               -e SUMMARY_PATH=/results/hedge-$mode.json grafana/k6 run /work/pd20.k6.js
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const read = mode => JSON.parse(fs.readFileSync("tai-lieu/ket-qua-do/pd20/hedge-"+mode+".json")).metrics.pd20_read_ms.values["p(99)"];
            const baseline = read(false), hedged = read(true);
            const reduction = 1 - hedged / baseline;
            console.log(JSON.stringify({baseline, hedged, reduction}));
            if (!(reduction >= .3)) process.exit(1);
          '
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd20-p99
          path: tai-lieu/ket-qua-do/pd20/
      - if: failure()
        run: docker compose logs --no-color --tail 60
