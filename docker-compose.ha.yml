services:
  db-a:
    command:
      - postgres
      - -c
      - wal_log_hints=on
      - -c
      - synchronous_commit=on

  # Chờ replica A streaming rồi mới bật chế độ đồng bộ.
  # Không đặt synchronous_standby_names trên dòng lệnh postgres,
  # để PD-14b có thể thay đổi bằng ALTER SYSTEM.
  db-a-sync-config:
    profiles: [ha]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: dev
    volumes:
      - ./postgres/configure-sync-a.sh:/configure-sync-a.sh:ro
    entrypoint: ["/bin/sh", "/configure-sync-a.sh"]
    depends_on:
      db-a:
        condition: service_healthy
      db-a-replica:
        condition: service_healthy

  parking-a:
    depends_on:
      db-a:
        condition: service_healthy
      db-a-sync-config:
        condition: service_completed_successfully
  # PD-14a: Enable replication settings for parking D.
  db-d:
    command: ["postgres", "-c", "wal_log_hints=on"]
    volumes:
      - db-d-data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro

  # PD-14a: Standby for parking D.
  db-d-replica:
    profiles: [ha]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICA_OF: db-d
      REPLICATION_PASSWORD: replica
      APPLICATION_NAME: db-d-replica
    volumes:
      - db-d-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      db-d:
        condition: service_healthy
    # PD-14a: Enable synchronous replication after standby D is streaming.
  db-d-sync-config:
    profiles: [ha]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: dev
    volumes:
      - ./postgres/configure-sync-d.sh:/configure-sync-d.sh:ro
    entrypoint: ["/bin/sh", "/configure-sync-d.sh"]
    depends_on:
      db-d:
        condition: service_healthy
      db-d-replica:
        condition: service_healthy
  # PD-14a: Parking E - asynchronous replication
  db-e:
    profiles: [ha]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: parking
    command: ["postgres", "-c", "wal_log_hints=on"]
    volumes:
      - db-e-data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-e-replica:
    profiles: [ha]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICA_OF: db-e
      REPLICATION_PASSWORD: replica
      APPLICATION_NAME: db-e-replica
    volumes:
      - db-e-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      db-e:
        condition: service_healthy
  # PD-14a: Parking F - asynchronous replication
  db-f:
    profiles: [ha]
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: parking
    command: ["postgres", "-c", "wal_log_hints=on"]
    volumes:
      - db-f-data:/var/lib/postgresql/data
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-f-replica:
    profiles: [ha]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICA_OF: db-f
      REPLICATION_PASSWORD: replica
      APPLICATION_NAME: db-f-replica
    volumes:
      - db-f-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 60
    depends_on:
      db-f:
        condition: service_healthy

volumes:
  db-d-replica-data:
  db-e-data:
  db-e-replica-data:
  db-f-data:
  db-f-replica-data: