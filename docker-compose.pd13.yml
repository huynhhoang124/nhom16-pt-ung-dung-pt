      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LEASE_TTL_S: "5"
      ZONE: bac
      ENABLE_TEST_FAULTS: "0"
      NODE_URL: http://parking-b-2:8002

      PARKING_ID: B
      PORT: "8002"
      SLOTS: "CAR:1:10,CAR:2:10,CAR:3:10,MOTO:1:30"
      DATABASE_URL: ${B_DATABASE_URL:-postgres://postgres:dev@db-b/parking}
      READ_DATABASE_URL: ${B_READ_DATABASE_URL:-}

    ports:
      - "8102:8002"

    depends_on:
      db-b:
        condition: service_healthy

    networks:
      default:
        aliases:
          - parking-b

  parking-c:
