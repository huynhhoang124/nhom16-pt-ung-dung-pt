
services:
  parking-a:
    networks:
      default:
        aliases:
          - parking-a

  parking-a-2:
    profiles:
      - pd13

    image: nhom16/parking-node

    environment:
      INTERNAL_KEY: ${INTERNAL_KEY:?Missing INTERNAL_KEY}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking:parking@rabbitmq/%2F}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LEASE_TTL_S: "5"
      ZONE: bac
      ENABLE_TEST_FAULTS: "0"
      NODE_URL: http://parking-a-2:8001

      PARKING_ID: A
      PORT: "8001"
      SLOTS: "CAR:1:10,CAR:2:10,MOTO:1:20"
      DATABASE_URL: ${A_DATABASE_URL:-postgres://postgres:dev@db-a/parking}
      READ_DATABASE_URL: ${A_READ_DATABASE_URL:-}

    ports:
      - "8101:8001"

    depends_on:
      db-a:
        condition: service_healthy

    networks:
      default:
        aliases:
          - parking-a

  parking-b:
    networks:
      default:
        aliases:
          - parking-b

  parking-b-2:
    profiles:
      - pd13
    image: nhom16/parking-node

    environment:
      INTERNAL_KEY: ${INTERNAL_KEY:?Missing INTERNAL_KEY}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://parking:parking@rabbitmq/%2F}
