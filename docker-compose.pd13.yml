      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LEASE_TTL_S: "5"
      ZONE: bac
      ENABLE_TEST_FAULTS: "0"
      NODE_URL: http://parking-c-2:8003

      PARKING_ID: C
      PORT: "8003"
