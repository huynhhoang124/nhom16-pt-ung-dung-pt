
services:
  # Hai Node cùng đăng ký alias để giữ tên truy cập của từng bãi.
  parking-a:
    networks:
      default:
        aliases:
          - parking-a

  parking-a-2:
    profiles:
      - pd13
    extends:
      file: docker-compose.yml
      service: parking-a
    environment:
      NODE_URL: http://parking-a-2:8001
    ports: !override
      - "8101:8001"
    networks:
      default:
        aliases:
          - parking-a

  parking-b:
    networks:
      default:
        aliases:
          - parking-b

  parking-b-2:
    profiles:
      - pd13
    extends:
      file: docker-compose.yml
      service: parking-b
    environment:
      NODE_URL: http://parking-b-2:8002
    ports: !override
      - "8102:8002"
    networks:
      default:
        aliases:
          - parking-b

  parking-c:
    networks:
      default:
        aliases:
          - parking-c

  parking-c-2:
    profiles:
      - pd13
    extends:
      file: docker-compose.yml
      service: parking-c
    environment:
      NODE_URL: http://parking-c-2:8003
    ports: !override
      - "8103:8003"
    networks:
      default:
        aliases:
          - parking-c
