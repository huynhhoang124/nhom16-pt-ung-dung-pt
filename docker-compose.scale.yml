    "toxiproxy": {
      "profiles": [
        "scale"
      ],
      "image": "ghcr.io/shopify/toxiproxy:2.9.0",
      "command": [
        "-host=0.0.0.0",
        "-config=/config/scale.json"
      ],
      "ports": [
        "8474:8474"
      ],
      "volumes": [
        "./toxiproxy/scale.json:/config/scale.json:ro"
      ],
      "depends_on": [
        "parking-d",
        "parking-e",
        "parking-f"
      ],
      "mem_limit": "64m"
    },
    "region-latency": {
      "profiles": [
        "scale"
      ],
      "image": "node:22-alpine",
      "working_dir": "/app",
      "command": [
        "node",
        "configure-region-latency.mjs"
      ],
      "volumes": [
        "./scripts/configure-region-latency.mjs:/app/configure-region-latency.mjs:ro"
      ],
      "depends_on": [
        "toxiproxy"
      ],
      "restart": "on-failure"
    }
