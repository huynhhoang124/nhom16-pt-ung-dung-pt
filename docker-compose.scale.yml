    "db-d": {
      "profiles": [
        "scale"
      ],
      "image": "postgres:16-alpine",
      "environment": {
        "POSTGRES_PASSWORD": "dev",
        "POSTGRES_DB": "parking"
      },
      "command": [
        "postgres",
        "-c",
        "shared_buffers=32MB",
        "-c",
        "wal_log_hints=on"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres -d parking"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "mem_limit": "192m",
      "shm_size": "64m",
      "volumes": [
        "db-d-data:/var/lib/postgresql/data",
        "./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro"
      ]
    },
    "parking-d": {
      "profiles": [
        "scale"
      ],
      "build": "./parking-node",
      "image": "nhom16/parking-node",
      "environment": {
        "INTERNAL_KEY": "${INTERNAL_KEY:?Thiếu INTERNAL_KEY (chạy cp .env.example .env)}",
        "RABBITMQ_URL": "${RABBITMQ_URL:-amqp://parking:parking@rabbitmq}",
        "RESERVATION_MINUTES": "${RESERVATION_MINUTES:-15}",
        "JWT_PUBLIC_KEY_B64": "${JWT_PUBLIC_KEY_B64:-}",
        "CORS_ORIGIN": "${CORS_ORIGIN:-http://localhost:3000}",
        "ETCD_ENDPOINTS": "http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379",
        "ZONE": "nam",
        "LEASE_TTL_S": "${LEASE_TTL_S:-5}",
        "PARKING_ID": "D",
        "PORT": 8004,
        "NODE_URL": "http://toxiproxy:18004",
        "SLOTS": "CAR:1:10,CAR:2:10",
        "DATABASE_URL": "postgres://postgres:dev@db-d/parking",
        "READ_DATABASE_URL": "postgres://postgres:dev@db-d-replica/parking"
      },
      "ports": [
        "8004:8004"
      ],
      "depends_on": {
        "db-d": {
          "condition": "service_healthy"
        },
        "db-d-sync-config": {
          "condition": "service_completed_successfully",
          "required": false
        }
      },
      "mem_limit": "256m"
    },
