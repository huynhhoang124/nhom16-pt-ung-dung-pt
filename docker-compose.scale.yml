{
  "services": {
    "db-agg": {
      "command": [
        "postgres",
        "-c",
        "shared_buffers=32MB"
      ],
      "mem_limit": "192m",
      "shm_size": "64m"
    },
    "aggregator": {
      "environment": {
        "ETCD_ENDPOINTS": "http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379",
        "ZONE": "bac"
      }
    },
    "aggregator-2": {
      "environment": {
        "ETCD_ENDPOINTS": "http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379",
        "ZONE": "bac"
      }
    },
    "db-a-replica": {
      "profiles": [
        "ha",
        "scale"
      ],
      "image": "postgres:16-alpine",
      "entrypoint": [
        "/bin/sh",
        "/replica-entrypoint.sh"
      ],
      "environment": {
        "PGDATA": "/var/lib/postgresql/data",
        "REPLICA_OF": "db-a",
        "REPLICATION_PASSWORD": "replica",
        "APPLICATION_NAME": "db-a-replica"
      },
      "volumes": [
        "db-a-replica-data:/var/lib/postgresql/data",
        "./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 60
      },
      "depends_on": {
        "db-a": {
          "condition": "service_healthy",
          "required": false
        }
      }
    },
    "db-a-sync-config": {
      "profiles": [
        "ha",
        "scale"
      ],
      "image": "postgres:16-alpine",
      "environment": {
        "PGPASSWORD": "dev"
      },
      "volumes": [
        "./postgres/configure-sync-a.sh:/configure-sync-a.sh:ro"
      ],
      "entrypoint": [
        "/bin/sh",
        "/configure-sync-a.sh"
      ],
      "depends_on": {
        "db-a": {
          "condition": "service_healthy"
        },
        "db-a-replica": {
          "condition": "service_healthy"
        }
      }
    },
    "db-a": {
      "command": [
        "postgres",
        "-c",
        "shared_buffers=32MB",
        "-c",
        "wal_log_hints=on"
      ],
      "mem_limit": "192m",
      "shm_size": "64m"
    },
    "parking-a": {
      "environment": {
        "ETCD_ENDPOINTS": "http://etcd-1:2379,http://etcd-2:2379,http://etcd-3:2379",
        "ZONE": "bac",
        "READ_DATABASE_URL": "postgres://postgres:dev@db-a-replica/parking"
      },
      "depends_on": {
        "db-a": {
          "condition": "service_healthy"
        },
        "db-a-sync-config": {
          "condition": "service_completed_successfully",
          "required": false
        }
      }
    },
