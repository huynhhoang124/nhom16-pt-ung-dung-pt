server {
  listen 80;
  root /usr/share/nginx/html;

  # Phân giải lại tên "aggregator" mỗi 10s: Aggregator khởi động lại (đổi IP) vẫn nối được.
  resolver 127.0.0.11 valid=10s;
  set $aggregator http://aggregator:8000;

  location / { try_files $uri /index.html; }

  location /api/ { proxy_pass $aggregator; }

  location /socket.io/ {
    proxy_pass $aggregator;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
