server {
  listen 80;
  root /usr/share/nginx/html;

  # GS-07: header bảo mật cơ bản (không cần thư viện)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

  # Phân giải lại tên "aggregator" mỗi 10s: Aggregator khởi động lại (đổi IP) vẫn nối được.
  resolver 127.0.0.11 valid=10s;
  set $aggregator http://aggregator:8000;

  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass $aggregator;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;   # GS-03: mã truy vết sinh ở cửa ngõ
  }

  location /socket.io/ {
    proxy_pass $aggregator;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
