log_format trace escape=json '{"ts":"$time_iso8601","service":"nginx",'
  '"requestId":"$request_id","responseRequestId":"$upstream_http_x_request_id",'
  '"method":"$request_method","path":"$uri","status":$status}';

upstream parking_aggregators {
  zone parking_aggregators 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server aggregator:8000 resolve;
  keepalive 64;
}

server {
  listen 80;
  access_log /dev/stdout trace buffer=16k flush=100ms;
  root /usr/share/nginx/html;

  # GS-07: header bảo mật cơ bản (không cần thư viện)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

  # Phân giải lại tên "aggregator" mỗi 10s: Aggregator khởi động lại (đổi IP) vẫn nối được.
  # PT-01 / PD-19: các bản Aggregator đang chạy dùng chung tên mạng "aggregator" để nginx chia tải;
  # một bản lỗi/tắt thì thử bản kia (proxy_next_upstream), người dùng không thấy lỗi.
  resolver 127.0.0.11 valid=10s;


  location / { try_files $uri /index.html; }

  location /api/ {
    error_page 418 = @api_read;
    if ($request_method ~ ^(GET|HEAD)$) { return 418; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://parking_aggregators;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;   # GS-03: mã truy vết sinh ở cửa ngõ
    # chỉ khi KHÔNG nối được (error) hoặc 502: chưa chắc bản kia đã xử lý; không thử lại khi timeout để tránh làm 2 lần
    proxy_next_upstream error http_502 non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_connect_timeout 2s;
  }

  # Read requests can retry a stale upstream address while Docker DNS catches up.
  location @api_read {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://parking_aggregators;
    proxy_next_upstream error timeout http_502;
    proxy_next_upstream_tries 4;
    proxy_connect_timeout 500ms;
  }

  location /socket.io/ {
    proxy_pass http://parking_aggregators;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
