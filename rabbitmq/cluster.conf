# PT-03: chỉ gắn cho rabbitmq-2/3 (profile ha): khởi động thì tự xin vào cụm của nút gốc rabbit@rabbitmq.
# Nút gốc không có file này nên chạy ngay dù không bật profile ha (trước đây nó chờ ~3 phút tìm 2 nút kia).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq
# Không dùng depends_on (khởi động lại cả cụm thì nút gốc lại chờ nút 2/3 -> chờ nhau mãi). Thay vào đó nút 2/3 thử
# xin vào cụm tới 60 lần x 2 s khi nút gốc chưa lên, thay vì mặc định ~5 s rồi chạy riêng lẻ (thành cụm tách đôi).
cluster_formation.discovery_retry_limit = 60
cluster_formation.discovery_retry_interval = 2000
