<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Mô hình kiến trúc phân tán - Bãi đỗ xe thông minh liên kết nhiều bãi</title>
  <desc id="desc">Sơ đồ gồm người dùng, ứng dụng web, Aggregator Service, ba Parking Node độc lập và ba cơ sở dữ liệu riêng.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowBlueStart" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1800" height="1100" fill="#f8fafc"/>
  <rect width="1800" height="120" fill="url(#header)"/>
  <text x="900" y="50" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">
    MÔ HÌNH KIẾN TRÚC PHÂN TÁN
  </text>
  <text x="900" y="88" fill="#dbeafe" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    Bãi đỗ xe thông minh liên kết nhiều bãi — Nhóm 16
  </text>
  <text x="900" y="148" fill="#334155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    Mỗi bãi là một node độc lập, sở hữu dữ liệu riêng và giao tiếp với các thành phần khác qua mạng
  </text>

  <!-- Users -->
  <g filter="url(#shadow)">
    <rect x="55" y="205" width="250" height="245" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <circle cx="180" cy="250" r="25" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <path d="M132 330 C132 286,228 286,228 330 L228 352 L132 352 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="180" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">NGƯỜI SỬ DỤNG</text>
  <text x="180" y="419" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Khách hàng • Nhân viên</text>
  <text x="180" y="441" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Quản trị viên</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="365" y="235" width="285" height="170" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  </g>
  <rect x="405" y="270" width="205" height="84" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="429" y="294" width="157" height="10" rx="5" fill="#67e8f9"/>
  <rect x="429" y="317" width="110" height="9" rx="4" fill="#bae6fd"/>
  <text x="507" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#164e63">WEB FRONTEND</text>
  <text x="507" y="401" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#0e7490">ReactJS • Một giao diện thống nhất</text>

  <!-- Aggregator -->
  <g filter="url(#shadow)">
    <rect x="735" y="205" width="360" height="245" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="4"/>
  </g>
  <text x="915" y="248" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#312e81">AGGREGATOR SERVICE</text>
  <text x="915" y="279" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#4338ca">Điểm truy cập và điều phối thống nhất</text>
  <line x1="775" y1="298" x2="1055" y2="298" stroke="#c7d2fe" stroke-width="2"/>
  <text x="778" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3730a3">• Đăng ký và định tuyến Parking Node</text>
  <text x="778" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3730a3">• Tổng hợp chỗ trống song song</text>
  <text x="778" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3730a3">• Health check, timeout, trạng thái OFFLINE</text>
  <text x="778" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#3730a3">• Không lưu trạng thái chi tiết từng slot</text>

  <!-- Connections top -->
  <line x1="305" y1="325" x2="365" y2="325" stroke="#475569" stroke-width="4" marker-end="url(#arrowGray)"/>
  <text x="335" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569">HTTPS</text>

  <line x1="650" y1="320" x2="735" y2="320" stroke="#2563eb" stroke-width="4" marker-start="url(#arrowBlueStart)" marker-end="url(#arrowBlue)"/>
  <text x="692" y="289" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">REST/JSON</text>
  <text x="692" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7c3aed">WebSocket</text>

  <!-- Distributed network bus -->
  <path d="M915 450 L915 510 L405 510 L405 575" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M915 450 L915 575" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M915 510 L1425 510 L1425 575" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="574" y="475" width="682" height="52" rx="22" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="915" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">REST/JSON qua mạng: tra cứu • đặt chỗ • hủy chỗ • health check</text>
  <text x="915" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Aggregator gọi các Parking Node đồng thời; node trả kết quả hoặc timeout</text>

  <!-- Parking A boundary -->
  <g filter="url(#shadow)">
    <rect x="170" y="575" width="470" height="355" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <text x="405" y="611" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#1e3a8a">HẠ TẦNG BÃI A — ĐỘC LẬP</text>
  <rect x="225" y="638" width="360" height="105" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="405" y="677" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#1e40af">PARKING NODE A</text>
  <text x="405" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1d4ed8">Slot A01–A20 • Reservation • Enter/Exit</text>
  <line x1="405" y1="743" x2="405" y2="794" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="420" y="774" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">SQL nội bộ</text>
  <g>
    <ellipse cx="405" cy="812" rx="128" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="277" y="812" width="256" height="67" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <ellipse cx="405" cy="879" rx="128" ry="25" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="405" y="842" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#166534">DATABASE A</text>
    <text x="405" y="869" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d">Dữ liệu riêng của Bãi A</text>
  </g>

  <!-- Parking B boundary -->
  <g filter="url(#shadow)">
    <rect x="680" y="575" width="470" height="355" rx="22" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <text x="915" y="611" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#4c1d95">HẠ TẦNG BÃI B — ĐỘC LẬP</text>
  <rect x="735" y="638" width="360" height="105" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="915" y="677" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#5b21b6">PARKING NODE B</text>
  <text x="915" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6d28d9">Slot B01–B30 • Reservation • Enter/Exit</text>
  <line x1="915" y1="743" x2="915" y2="794" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="930" y="774" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">SQL nội bộ</text>
  <g>
    <ellipse cx="915" cy="812" rx="128" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="787" y="812" width="256" height="67" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <ellipse cx="915" cy="879" rx="128" ry="25" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="915" y="842" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#166534">DATABASE B</text>
    <text x="915" y="869" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d">Dữ liệu riêng của Bãi B</text>
  </g>

  <!-- Parking C boundary -->
  <g filter="url(#shadow)">
    <rect x="1190" y="575" width="470" height="355" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3" stroke-dasharray="10 7"/>
  </g>
  <text x="1425" y="611" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#7c2d12">HẠ TẦNG BÃI C — ĐỘC LẬP</text>
  <rect x="1245" y="638" width="360" height="105" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="1425" y="677" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#9a3412">PARKING NODE C</text>
  <text x="1425" y="708" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c2410c">Slot C01–C15 • Reservation • Enter/Exit</text>
  <line x1="1425" y1="743" x2="1425" y2="794" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text x="1440" y="774" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">SQL nội bộ</text>
  <g>
    <ellipse cx="1425" cy="812" rx="128" ry="25" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="1297" y="812" width="256" height="67" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <ellipse cx="1425" cy="879" rx="128" ry="25" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/>
    <text x="1425" y="842" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#166534">DATABASE C</text>
    <text x="1425" y="869" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#15803d">Dữ liệu riêng của Bãi C</text>
  </g>

  <!-- Key properties -->
  <rect x="170" y="965" width="1490" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="216" cy="1004" r="13" fill="#22c55e"/>
  <text x="242" y="1011" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Không dùng chung CSDL</text>
  <circle cx="544" cy="1004" r="13" fill="#3b82f6"/>
  <text x="570" y="1011" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Giao tiếp qua mạng</text>
  <circle cx="855" cy="1004" r="13" fill="#8b5cf6"/>
  <text x="881" y="1011" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Node B lỗi ⇒ A và C vẫn hoạt động</text>
  <circle cx="1302" cy="1004" r="13" fill="#f97316"/>
  <text x="1328" y="1011" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">Có thể thêm Node D, E…</text>

  <text x="900" y="1075" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">
    Nhóm 16: Vũ Văn Hùng • Hoàng Văn Huynh • Nguyễn Văn Luân • Trịnh Kim Loan • Đỗ Huyền Trang • Phạm Sỹ Hiệp
  </text>
</svg>
