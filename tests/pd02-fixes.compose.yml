# Isolated ports/images; all databases/queues/volumes use COMPOSE_PROJECT_NAME.
services:
  rabbitmq:
    ports: !override ["127.0.0.1:5674:5672", "127.0.0.1:15674:15672"]
  db-a:
    ports: ["127.0.0.1:25432:5432"]
  parking-a:
    image: pd02-fix/parking-node:20261103
    ports: !override ["127.0.0.1:18001:8001"]
  parking-b:
    image: pd02-fix/parking-node:20261103
    ports: !override ["127.0.0.1:18002:8002"]
  parking-c:
    image: pd02-fix/parking-node:20261103
    ports: !override ["127.0.0.1:18003:8003"]
  aggregator:
    image: pd02-fix/aggregator:20261103
    ports: !override ["127.0.0.1:18000:8000"]
    environment:
      COMMAND_MODE: http
  frontend:
    image: pd02-fix/frontend:20261103
    ports: !override ["127.0.0.1:13000:80"]
  notification:
    image: pd02-fix/notification:20261103
  pd02-unit:
    profiles: [pd02-tests]
    build: { context: ., dockerfile: tests/pd02-fixes.Dockerfile }
    image: pd02-fix/unit:20261103
