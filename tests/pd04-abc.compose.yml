# A-C on normal dev entrypoints; isolated test-only ports/images/volumes.
services:
  rabbitmq:
    ports: !override ["127.0.0.1:5684:5672", "127.0.0.1:15684:15672"]
  db-a:
    ports: ["127.0.0.1:25451:5432"]
  db-b:
    ports: ["127.0.0.1:25452:5432"]
  db-c:
    ports: ["127.0.0.1:25453:5432"]
  db-agg:
    ports: ["127.0.0.1:25454:5432"]
  parking-a:
    image: pd04-abc/parking-node:20261103
    ports: !override ["127.0.0.1:18201:8001"]
  parking-b:
    image: pd04-abc/parking-node:20261103
    ports: !override ["127.0.0.1:18202:8002"]
  parking-c:
    image: pd04-abc/parking-node:20261103
    ports: !override ["127.0.0.1:18203:8003"]
  aggregator:
    image: pd04-abc/aggregator:20261103
    ports: !override ["127.0.0.1:18020:8000"]
    environment:
      COMMAND_MODE: http
      ADMIN_BROADCAST_ENABLED: 'true'
  frontend:
    image: pd04-abc/frontend:20261103
    ports: !override ["127.0.0.1:13020:80"]
  notification:
    image: pd04-abc/notification:20261103
